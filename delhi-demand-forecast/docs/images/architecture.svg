<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="420" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="600" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">PeakWatch Delhi: data flow</text>

  <!-- Row 1: sources -->
  <g>
    <rect x="40" y="70" width="200" height="86" rx="10" fill="#ffffff" stroke="#94a3b8"/>
    <text x="140" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Delhi system load</text>
    <text x="140" y="118" text-anchor="middle" font-size="12" fill="#475569">SLDC 5-min readings 2023-2026</text>
    <text x="140" y="136" text-anchor="middle" font-size="12" fill="#475569">aggregated to hourly mean (MW)</text>
  </g>
  <g>
    <rect x="40" y="176" width="200" height="86" rx="10" fill="#ffffff" stroke="#94a3b8"/>
    <text x="140" y="204" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Weather</text>
    <text x="140" y="224" text-anchor="middle" font-size="12" fill="#475569">history: supplied hourly file</text>
    <text x="140" y="242" text-anchor="middle" font-size="12" fill="#475569">forecast: Open-Meteo (no key)</text>
  </g>
  <g>
    <rect x="40" y="282" width="200" height="86" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-dasharray="6 4"/>
    <text x="140" y="310" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Offline fallback</text>
    <text x="140" y="330" text-anchor="middle" font-size="12" fill="#92400e">data/demo + weather cache</text>
    <text x="140" y="348" text-anchor="middle" font-size="12" fill="#92400e">always labelled, never silent</text>
  </g>

  <!-- ML pipeline -->
  <g>
    <rect x="300" y="110" width="210" height="150" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="405" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">ml/ pipeline</text>
    <text x="405" y="162" text-anchor="middle" font-size="12" fill="#1e40af">clean + regularise to hourly</text>
    <text x="405" y="182" text-anchor="middle" font-size="12" fill="#1e40af">calendar + holiday features</text>
    <text x="405" y="202" text-anchor="middle" font-size="12" fill="#1e40af">leakage-safe lags: 1 h, 24 h, 168 h</text>
    <text x="405" y="222" text-anchor="middle" font-size="12" fill="#1e40af">temperature, humidity, wind</text>
    <text x="405" y="242" text-anchor="middle" font-size="12" fill="#1e40af">chronological train / val / test</text>
  </g>

  <g>
    <rect x="570" y="110" width="210" height="150" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="675" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Model (model.joblib)</text>
    <text x="675" y="162" text-anchor="middle" font-size="12" fill="#1e40af">HistGradientBoosting</text>
    <text x="675" y="182" text-anchor="middle" font-size="12" fill="#1e40af">recursive 24-168 h forecast</text>
    <text x="675" y="202" text-anchor="middle" font-size="12" fill="#1e40af">P10-P90 band per lead hour</text>
    <text x="675" y="222" text-anchor="middle" font-size="12" fill="#1e40af">test MAE 69 MW vs 298 baseline</text>
    <text x="675" y="242" text-anchor="middle" font-size="12" fill="#1e40af">permutation importance</text>
  </g>

  <!-- API -->
  <g>
    <rect x="840" y="110" width="150" height="150" rx="10" fill="#ecfdf5" stroke="#10b981"/>
    <text x="915" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">FastAPI</text>
    <text x="915" y="160" text-anchor="middle" font-size="12" fill="#047857">/api/forecast</text>
    <text x="915" y="178" text-anchor="middle" font-size="12" fill="#047857">/api/alerts</text>
    <text x="915" y="196" text-anchor="middle" font-size="12" fill="#047857">/api/feeders</text>
    <text x="915" y="214" text-anchor="middle" font-size="12" fill="#047857">/api/weather-impact</text>
    <text x="915" y="232" text-anchor="middle" font-size="12" fill="#047857">/api/whatif  /api/model</text>
    <text x="915" y="250" text-anchor="middle" font-size="11" fill="#047857">every response carries data_source</text>
  </g>

  <!-- Frontend -->
  <g>
    <rect x="1020" y="70" width="150" height="230" rx="10" fill="#f5f3ff" stroke="#8b5cf6"/>
    <text x="1095" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">React dashboard</text>
    <text x="1095" y="122" text-anchor="middle" font-size="12" fill="#5b21b6">Overview</text>
    <text x="1095" y="142" text-anchor="middle" font-size="12" fill="#5b21b6">Forecast</text>
    <text x="1095" y="162" text-anchor="middle" font-size="12" fill="#5b21b6">Alerts</text>
    <text x="1095" y="182" text-anchor="middle" font-size="12" fill="#5b21b6">Areas (DISCOM split)</text>
    <text x="1095" y="202" text-anchor="middle" font-size="12" fill="#5b21b6">Weather impact</text>
    <text x="1095" y="222" text-anchor="middle" font-size="12" fill="#5b21b6">What-if scenarios</text>
    <text x="1095" y="242" text-anchor="middle" font-size="12" fill="#5b21b6">Model card</text>
    <text x="1095" y="272" text-anchor="middle" font-size="11" fill="#6d28d9">Vite + Tailwind + Recharts</text>
  </g>

  <!-- Arrows -->
  <line x1="240" y1="113" x2="300" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="240" y1="219" x2="300" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="240" y1="325" x2="300" y2="240" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <line x1="510" y1="185" x2="570" y2="185" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="780" y1="185" x2="840" y2="185" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="990" y1="185" x2="1020" y2="185" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Footer -->
  <rect x="300" y="300" width="690" height="80" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="645" y="326" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Honesty rules</text>
  <text x="645" y="348" text-anchor="middle" font-size="12" fill="#475569">Every panel shows its provenance: REAL HISTORICAL / SIMULATED / MODEL PREDICTION / LIVE, CACHED or SIMULATED WEATHER / ASSUMPTION</text>
  <text x="645" y="368" text-anchor="middle" font-size="12" fill="#475569">Free services only. Runs fully offline. Degrades to labelled fallbacks instead of failing.</text>
</svg>
