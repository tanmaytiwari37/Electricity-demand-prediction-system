# Render Blueprint for the PeakWatch Delhi API (free tier).
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo. The frontend is
# deployed separately on Vercel (see README "Deployment").
services:
  - type: web
    name: peakwatch-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m backend.main
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: PEAKWATCH_HISTORY_CSV
        value: data/processed/delhi_history.csv
      - key: PEAKWATCH_CAPACITY_MW
        value: "9200"
      # Set to the Vercel URL after the first frontend deploy, e.g. https://peakwatch.vercel.app
      - key: PEAKWATCH_FRONTEND_ORIGIN
        sync: false
